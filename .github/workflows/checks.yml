name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check independently encoded Soroban fixture
        run: python3 tests/fixtures/contract_call.py | diff - <(cat tests/fixtures/contract_call.xdr tests/fixtures/contract_call.sha256)

  tvc-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/tvc
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make smoke
      - name: Container logs
        if: always()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
