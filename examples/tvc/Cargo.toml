[package]
name = "stellar-tvc-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tvc_app"
path = "src/main.rs"

[[bin]]
name = "mock-turnkey"
path = "src/bin/mock_turnkey.rs"

[dependencies]
stellar-parser = { path = "../.." }
axum = "0.8"
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
turnkey_api_key_stamper = "=0.16.1"
turnkey_client = "=0.16.1"

[lints.rust]
unsafe_code = "forbid"
